function makeDivHidden(element) {
  console.log("Making div hidden");
  element.style.display = "none";
}
// make div hidden by classname
function makeDivHiddenByClassName(className) {
  console.log("Making div hidden by class name");
  const elements = document.getElementsByClassName(className);
  for (let i = 0; i < elements.length; i++) {
    elements[i].style.display = "none";
  }
}
